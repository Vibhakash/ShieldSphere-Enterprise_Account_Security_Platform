<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title description">
  <title id="title">ShieldSphere animated taglines</title>
  <desc id="description">Two ShieldSphere security taglines appear one after the other with a typewriter reveal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#0b213d"/></linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <clipPath id="first-clip"><rect x="40" y="22" width="0" height="48"><animate attributeName="width" values="0;0;1090;1090;0" keyTimes="0;0.05;0.40;0.82;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="second-clip"><rect x="40" y="84" width="0" height="42"><animate attributeName="width" values="0;0;0;820;820;0" keyTimes="0;0.40;0.45;0.72;0.82;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1200" height="150" rx="18" fill="url(#background)"/>
  <circle cx="1150" cy="25" r="100" fill="#0ea5e9" opacity=".10"/><circle cx="1070" cy="155" r="120" fill="#8b5cf6" opacity=".10"/>
  <path d="M30 18v114" stroke="#38bdf8" stroke-width="3" opacity=".75"/>
  <text x="40" y="62" fill="url(#headline)" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700" clip-path="url(#first-clip)">Secure Every Identity. Monitor Every Threat. Protect Every Enterprise.</text>
  <text x="40" y="115" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500" clip-path="url(#second-clip)">The Security Layer Every Application Deserves.</text>
  <rect x="40" y="30" width="3" height="36" fill="#38bdf8"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.40;0.42;0.99;1" dur="10s" repeatCount="indefinite"/></rect>
  <rect x="40" y="86" width="3" height="32" fill="#e2e8f0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.45;0.82;0.84" dur="10s" repeatCount="indefinite"/></rect>
</svg>
